server {
    listen 80;
    server_name localhost;
    client_max_body_size 10M;

    # ── Enable pre-compressed static files ───────────────
    # nginx will serve .gz versions of assets automatically
    # (requires the ngx_http_gzip_static_module, which is standard)
    gzip_static on;

    # ── Root & SPA fallback ───────────────────────────────
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # HTML: short cache (5 min) — always re-validate
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    # ── Hashed static assets — cache forever ─────────────
    # Vite outputs filenames like index-Dqg6UjNc.js — content-hashed,
    # so they are safe to cache for 1 year (immutable).
    location /assets/ {
        root /usr/share/nginx/html;
        gzip_static on;

        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary "Accept-Encoding";

        access_log off;
    }

    # ── Manifest / SW — short cache ───────────────────────
    location ~* \.(webmanifest|manifest\.json|sw\.js)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # ── Proxy API requests to the backend ────────────────
    location /api {
        proxy_pass http://backend:8080/api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
